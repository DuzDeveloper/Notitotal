version: '3.8'

services:
  # Backend Flask
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: football-news-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      DATABASE_PATH: /app/news.db
    volumes:
      - ./backend:/app
    command: python app.py
    networks:
      - football-network

  # Frontend React (con Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: football-news-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - football-network
    command: npm run dev

networks:
  football-network:
    driver: bridge
